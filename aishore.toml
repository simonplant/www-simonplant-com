# aishore configuration (node profile). Human-owned: listed in ownership.locked.
base = "main"
src = ["src"]          # production code roots: LOC budget, new files and classes, mutation
worktree_root = "../.wt"         # task worktrees: ../.wt/<repo>-<task id>

[commands]
# Gate steps in order. An empty string skips the step. setup runs once in each new worktree.
setup = "npm ci --no-audit --no-fund"
lint = ""
types = "npx tsc --noEmit"
imports = ""
tests = ""      # everything except tests/acceptance; the harness runs those per task

[acceptance]
# Runs acceptance, finding, and counterexample tests. {tests} becomes the quoted file list.
cmd = "node --test {tests}"
fail_codes = []    # exit codes meaning "a test failed"; empty: any non-zero
empty_codes = []   # exit codes meaning "no tests found"; start refuses them
# A failing test proves a defect when its output matches assert_pattern or production code raised.
assert_pattern = "AssertionError|ERR_ASSERTION|expect\\(received\\)"   # empty: any failure proves
path = "tests/acceptance/{name}.accept.ts"   # {name} is the task slug (t_042) or a finding (t_042_f1); never auto-discovered by commands.tests
lang = "typescript"

[format]
# PostToolUse formatter per extension; {file} is the edited file. Non-zero exit is fed back to the agent.


[replay]
# Prints one event per line to stdout for one recorded input ({input}, quoted). Empty cmd disables replay.
cmd = ""
cases = "replay/cases"
golden = "replay/golden"

[mutation]
# Python only. tests defaults to commands.tests; the task's acceptance tests always run too.
tests = ""
max_mutants = 40
timeout_factor = 5

[implement]
model = "claude-opus-5-5"
# `aishore run` appends --model, --resume and the prompt, and reads the JSON result.
headless = ["claude", "-p", "--output-format", "json", "--permission-mode", "acceptEdits",
            "--allowedTools", "Bash,Edit,Write,MultiEdit,Read,Glob,Grep"]

[review]
# A separate headless process in the worktree: fresh context, read-only tools, a different model.
model = "claude-fable-5-1"
cmd = ["claude", "-p", "--output-format", "text", "--tools", "Read,Grep,Glob", "--allowedTools", "Read,Grep,Glob", "--max-turns", "40"]
context = ["ENGINEERING.md", "docs/ARCHITECTURE.md"]   # files the reviewer receives with every review

[defaults]
loc_budget = 200
max_new_files = 1
max_new_classes = 0

[ownership]
# Agents read these and never write them: hooks, read-only files in the worktree, and the diff gate.
locked = [
  "aishore.toml",
  ".aishore/aishore/**",
  ".aishore/bin/**",
  "ENGINEERING.md",
  "CLAUDE.md",
  "AGENTS.md",
  ".claude/settings.json",
  ".claude/commands/**",
  ".claude/agents/**",
  ".claude/skills/**",
  ".github/**",
  ".gitignore",
  "Makefile",
  "tasks/**",
  "docs/**",
  "replay/**",
  "tests/acceptance/**",
  "tests/property/**",
  "pyproject.toml",
  "requirements*.txt",
  "uv.lock",
  "poetry.lock",
  "setup.cfg",
  "setup.py",
  "pytest.ini",
  "tox.ini",
  "*conftest.py",
  ".python-version",
  "package.json",
  "package-lock.json",
  "pnpm-lock.yaml",
  "yarn.lock",
  ".npmrc",
  "tsconfig*.json",
  "vitest.config.*",
  "jest.config.*",
  "eslint.config.*",
  ".eslintrc*",
  ".prettierrc*",
  "go.mod",
  "go.sum",
  "Cargo.toml",
  "Cargo.lock",
]
